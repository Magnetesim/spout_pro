[project]
name = "spout-rl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spout_rl"]
